name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build without publishing a release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  NXENGINE_REPO: https://github.com/nxengine/nxengine-evo
  TRANSLATIONS_REPO: https://github.com/nxengine/translations
  CAVESTORY_URL: https://www.cavestory.org/downloads/cavestoryen.zip

jobs:
  prepare-fonts:
    name: Prepare Ark Pixel fonts (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Download and extract fonts
        shell: pwsh
        run: |
          $headers = @{}
          if ($env:GITHUB_TOKEN) {
            $headers['Authorization'] = "token $env:GITHUB_TOKEN"
          }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/TakWolf/ark-pixel-font/releases/latest" -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -like 'ark-pixel-font-12px-monospaced-ttf-v*.zip' } | Select-Object -First 1
          if (-not $asset) {
            Write-Error 'Could not find ark-pixel-font 12px monospaced TTF asset'
            exit 1
          }
          $url = $asset.browser_download_url
          Write-Host "Downloading fonts from $url"
          Invoke-WebRequest -Uri $url -OutFile "font.zip" -Headers $headers
          Expand-Archive -Path "font.zip" -DestinationPath "font_extracted" -Force
          $ttfs = Get-ChildItem "font_extracted" -Filter "*.ttf"
          if (-not $ttfs) {
            Write-Error "No TTF files found in font archive"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path "assets" | Out-Null
          $ttfs | Copy-Item -Destination "assets/"
          Write-Host "Fonts ready:"
          Get-ChildItem "assets/*.ttf" | ForEach-Object { Write-Host $_.Name }

      - name: Upload font artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: ark-pixel-font
          path: assets/*.ttf
          retention-days: 1

  prepare-data:
    name: Prepare multilingual game data
    runs-on: ubuntu-latest
    needs: prepare-fonts
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq \
            build-essential cmake ninja-build git \
            libsdl2-dev libsdl2-mixer-dev libsdl2-image-dev \
            libpng-dev libjpeg-dev unzip wget curl

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="0.0.0-${GITHUB_RUN_NUMBER}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Download font artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: ark-pixel-font
          path: font

      - name: Build multilingual localized data
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/prepare-data.sh \
            "${{ steps.version.outputs.version }}"

      - name: Upload game data artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: game-data
          path: dist/data
          retention-days: 1

  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    needs: prepare-data
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Download game data
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: game-data
          path: game-data/data

      - name: Setup MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-git
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_mixer
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-libjpeg-turbo

      - name: Build and stage
        shell: msys2 {0}
        run: |
          set -euo pipefail
          bash scripts/build-windows.sh \
            "${{ needs.prepare-data.outputs.version }}" \
            "game-data/data"

      - name: Zip Windows dist
        shell: pwsh
        run: |
          $version = "${{ needs.prepare-data.outputs.version }}"
          Compress-Archive -Path "dist/NXEngine-Evo" -DestinationPath "dist/NXEngine-Evo-${version}-Win64.zip" -Force
          Remove-Item -Recurse -Force "dist/NXEngine-Evo"
          Get-ChildItem dist

      - name: Upload Windows artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: NXEngine-Evo-${{ needs.prepare-data.outputs.version }}-Win64
          path: dist/*.zip
          retention-days: 1

  build-linux:
    name: Build Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: prepare-data
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Download game data
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: game-data
          path: game-data/data

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq \
            build-essential cmake ninja-build git \
            libsdl2-dev libsdl2-mixer-dev libsdl2-image-dev \
            libpng-dev libjpeg-dev wget

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-linux.sh \
            "${{ needs.prepare-data.outputs.version }}" \
            "${{ matrix.arch }}" \
            "game-data/data"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4
        with:
          name: NXEngine-Evo-${{ needs.prepare-data.outputs.version }}-Linux-${{ matrix.arch }}
          path: dist/*.AppImage
          retention-days: 1

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          path: artifacts
          pattern: NXEngine-Evo-*

      - name: Flatten artifacts
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.zip' -o -name '*.AppImage' \) -exec cp {} release/ \;
          ls -la release/

      - name: Create release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Build {0}', github.run_number) }}
          draft: false
          files: release/*
